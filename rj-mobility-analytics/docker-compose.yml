version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rj_mobility_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_mobilidade_rj
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: